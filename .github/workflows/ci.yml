# Syntax check on every PHP version PrestaShop 9 supports, unit tests, translations, coding standard and PHPStan.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, simplexml, mbstring
          coverage: none
      - name: Syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests
        run: php tests/run-tests.php
      - name: Translations
        run: php tools/i18n-check.php

  # PrestaShop's coding standard and PHPStan configuration (prestashop/php-dev-tools).
  quality:
    runs-on: ubuntu-latest
    env:
      # PrestaShop core the module is analysed against.
      PS_IMAGE: prestashop/prestashop:9.2.1-8.3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, simplexml, mbstring
          coverage: none
      - name: Install the tools
        run: composer install --no-interaction --no-progress
      - name: Coding standard (php-cs-fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: PHPStan against PrestaShop's core
        run: |
          docker run --rm -v "$PWD":/module -w /module -e _PS_ROOT_DIR_=/var/www/html \
            --entrypoint php "$PS_IMAGE" -d memory_limit=2G vendor/bin/phpstan analyse --no-progress
